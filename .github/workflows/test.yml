name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'Documentation~/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'Documentation~/**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        id: tests
        timeout-minutes: 15
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GAME_CI_COVERAGE_ENABLED: "false"
        with:
          projectPath: .ci/TestProject
          unityVersion: 6000.6.7f1
          testMode: ${{ matrix.testMode }}
          cliVersion: v0.1.72
          artifactsPath: artifacts~/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (${{ matrix.testMode }})

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: artifacts~/${{ matrix.testMode }}